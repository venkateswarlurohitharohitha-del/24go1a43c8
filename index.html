<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
</head>

<body>

    <h1>Student Grade Calculator</h1>

    <label>Student Name:</label>
    <input type="text" id="name">
    <br><br>

    <label>Roll Number:</label>
    <input type="text" id="roll">
    <br><br>

    <label>Maths:</label>
    <input type="number" id="maths">
    <br><br>

    <label>English:</label>
    <input type="number" id="english">
    <br><br>

    <label>Computer:</label>
    <input type="number" id="computer">
    <br><br>

    <label>Science:</label>
    <input type="number" id="science">
    <br><br>

    <label>Social:</label>
    <input type="number" id="social">
    <br><br>

    <button onclick="calculateGrade()">Calculate Grade</button>

    <h2>Result</h2>

    <p>Total: <span id="total">-</span></p>
    <p>Average: <span id="average">-</span></p>
    <p>Grade: <span id="grade">-</span></p>
    <p>Result: <span id="result">-</span></p>


    <script>
        function calculateGrade() {

            let maths = Number(document.getElementById("maths").value);
            let english = Number(document.getElementById("english").value);
            let computer = Number(document.getElementById("computer").value);
            let science = Number(document.getElementById("science").value);
            let social = Number(document.getElementById("social").value);

            let total = maths + english + computer + science + social;
            let average = total / 5;

            let grade;

            if (average >= 90) {
                grade = "A+";
            }
            else if (average >= 80) {
                grade = "A";
            }
            else if (average >= 70) {
                grade = "B";
            }
            else if (average >= 60) {
                grade = "C";
            }
            else if (average >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            let result;

            if (average >= 50) {
                result = "PASS";
            }
            else {
                result = "FAIL";
            }

            document.getElementById("total").innerHTML = total;
            document.getElementById("average").innerHTML = average.toFixed(2) + "%";
            document.getElementById("grade").innerHTML = grade;
            document.getElementById("result").innerHTML = result;
        }
    </script>

</body>
</html>
